<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Your Trip | Kalki Pradee Tours & Travels</title>

<link rel="icon" href="images/logo.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand text-warning fw-bold"
href="index.html">

Kalki Pradee Tours & Travels

</a>

</div>

</nav>

<section class="py-5">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg border-0 p-4">

<h2 class="text-center mb-4">

Book Your Trip

</h2>

<form id="bookingForm">

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
id="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Mobile Number

</label>

<input
type="tel"
id="mobile"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Pickup Location

</label>

<input
type="text"
id="pickup"
class="form-control"
placeholder="Enter Pickup Location"
required>

</div>

<div class="mb-3">

<label class="form-label">

Destination

</label>

<input
type="text"
id="destination"
class="form-control"
placeholder="Enter Destination"
required>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Journey Date

</label>

<input
type="date"
id="journeyDate"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Passengers

</label>

<input
type="number"
id="passengers"
class="form-control"
min="1"
max="17"
required>

</div>

</div>
<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Vehicle Type

</label>

<select
id="vehicle"
class="form-select"
required>

<option value="">

Select Vehicle

</option>

<option value="19">

Non AC Tempo Traveller (₹19/KM)

</option>

<option value="23">

AC Tempo Traveller (₹23/KM)

</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Distance (KM)

</label>

<input
type="number"
id="distance"
class="form-control"
placeholder="Enter Distance"
required>

</div>

</div>

<div class="mb-3">

<label class="form-label">

Trip Days

</label>

<input
type="number"
id="days"
class="form-control"
value="1"
min="1"
required>

</div>

<div class="mb-3">

<label class="form-label">

Special Instructions

</label>

<textarea
id="message"
class="form-control"
rows="4"
placeholder="Write your requirements..."></textarea>

</div>

<div class="alert alert-warning">

<h5 class="mb-2">

Estimated Fare

</h5>

<h2 id="totalFare">

₹0

</h2>

</div>

<div class="d-grid">

<button
type="button"
id="calculateBtn"
class="btn btn-dark btn-lg">

Calculate Fare

</button>

</div>

<div class="d-grid mt-3">

<button
type="submit"
class="btn btn-warning btn-lg">

Book Now

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</section>
<footer class="bg-dark text-white text-center py-4">

<div class="container">

<p class="mb-0">

© 2026 Kalki Pradee Tours & Travels

All Rights Reserved.

</p>

</div>

</footer>

<script type="module">

import {
getFirestore,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

import { app } from "./js/firebase.js";

const db=getFirestore(app);

const calculateBtn=document.getElementById("calculateBtn");

calculateBtn.addEventListener("click",()=>{

const km=parseFloat(document.getElementById("distance").value);

const rate=parseFloat(document.getElementById("vehicle").value);

const days=parseFloat(document.getElementById("days").value);

if(isNaN(km)||isNaN(rate)||isNaN(days)){

alert("Please fill all required fields.");

return;

}

const total=(km*rate)+(days*500);

document.getElementById("totalFare").innerHTML="₹"+total;

});

const bookingForm=document.getElementById("bookingForm");

bookingForm.addEventListener("submit",async(e)=>{

e.preventDefault();

try{

await addDoc(collection(db,"bookings"),{

name:document.getElementById("name").value,

mobile:document.getElementById("mobile").value,

pickup:document.getElementById("pickup").value,

destination:document.getElementById("destination").value,

journeyDate:document.getElementById("journeyDate").value,

passengers:document.getElementById("passengers").value,

vehicle:document.getElementById("vehicle").value,

distance:document.getElementById("distance").value,

days:document.getElementById("days").value,

message:document.getElementById("message").value,

fare:document.getElementById("totalFare").innerText,

createdAt:new Date()

});

alert("Booking Submitted Successfully!");

bookingForm.reset();

document.getElementById("totalFare").innerHTML="₹0";

}catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
