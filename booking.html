<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Your Trip | Kalki Pradee Tours & Travels</title>

<link rel="icon" href="images/logo.jpg">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
background:#f8f9fa;
font-family:Poppins,sans-serif;
}

.navbar{
background:#000;
}

.navbar-brand{
color:#ffc107!important;
font-weight:bold;
}

.card{
border:none;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

#map{
height:400px;
border-radius:15px;
}

.btn-warning{
font-weight:bold;
border-radius:50px;
}

.form-control,
.form-select{
border-radius:12px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a href="index.html"

class="navbar-brand">

<img src="images/logo.jpg"

width="40"

class="rounded-circle me-2">

Kalki Pradee Tours & Travels

</a>

</div>

</nav>

<div class="container py-5">

<div class="row">

<div class="col-lg-5">

<div class="card p-4">

<h3 class="mb-4">

Book Your Trip

</h3>

<form id="bookingForm">

<div class="mb-3">

<label>

Full Name

</label>

<input

type="text"

id="name"

class="form-control"

required>

</div>

<div class="mb-3">

<label>

Mobile Number

</label>

<input

type="tel"

id="mobile"

class="form-control"

required>

</div>

<div class="mb-3">

<label>

Journey Date

</label>

<input

type="date"

id="journeyDate"

class="form-control"

required>

</div>

<div class="mb-3">

<label>

Passengers

</label>

<input

type="number"

id="passengers"

class="form-control"

min="1"

max="17"

required>

</div>

<div class="mb-3">

<label>

Vehicle

</label>

<select

id="vehicle"

class="form-select"

required>

<option value="">

Select Vehicle

</option>

<option>

12+1 Tempo Traveller

</option>

<option>

17+1 Tempo Traveller

</option>

</select>

</div>
<div class="mb-3">

<label class="form-label">

Pickup Location

</label>

<div class="input-group">

<input

type="text"

id="pickup"

class="form-control"

placeholder="Use current location"

readonly>

<button

type="button"

id="currentLocation"

class="btn btn-warning">

<i class="bi bi-geo-alt-fill"></i>

Use My Location

</button>

</div>

<small class="text-muted">

Allow location permission to detect your current location.

</small>

</div>

<div class="mb-3">

<label class="form-label">

Destination (Karnataka Only)

</label>

<input

type="text"

id="destination"

class="form-control"

placeholder="Example: Mysuru, Hassan, Bengaluru"

required>

</div>

<div class="mb-3">

<label class="form-label">

Special Requirements

</label>

<textarea

id="message"

class="form-control"

rows="4"

placeholder="Any pickup instructions or special requirements..."></textarea>

</div>

<div class="mb-3">

<label class="form-label">

Estimated Distance

</label>

<input

type="text"

id="distance"

class="form-control"

value="Will be calculated automatically"

readonly>

</div>

<div class="mb-3">

<label class="form-label">

Estimated Fare

</label>

<input

type="text"

id="fare"

class="form-control"

value="₹0"

readonly>

</div>

<div class="d-grid">

<button

type="submit"

class="btn btn-warning btn-lg">

Book Now

</button>

</div>

</form>

</div>

</div>

<div class="col-lg-7">

<div class="card p-3">

<h4 class="mb-3">

Pickup & Destination Map

</h4>

<div id="map"></div>

<p class="text-muted mt-3 mb-0">

📍 Tap <b>Use My Location</b> to fill your pickup location automatically. Later we'll add Karnataka-only destination search and automatic route calculation.

</p>

</div>

</div>

</div>

</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map=L.map("map").setView([12.9716,77.5946],7);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);

let marker;

document.getElementById("currentLocation").addEventListener("click",()=>{

if(!navigator.geolocation){

alert("Your browser doesn't support GPS.");

return;

}

navigator.geolocation.getCurrentPosition(

async(position)=>{

const lat=position.coords.latitude;
const lng=position.coords.longitude;

map.setView([lat,lng],16);

if(marker){

map.removeLayer(marker);

}

marker=L.marker([lat,lng]).addTo(map);

try{

const response=await fetch(

`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`

);

const data=await response.json();

document.getElementById("pickup").value=data.display_name;

window.pickupLatitude=lat;
window.pickupLongitude=lng;
window.pickupAddress=data.display_name;

}
catch(error){

document.getElementById("pickup").value=
lat+", "+lng;

}

},

()=>{

alert("Please allow location permission.");

}

);

});

</script>
