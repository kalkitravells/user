<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Your Trip | Kalki Pradee Tours & Travels</title>

<link rel="icon" href="images/logo.jpg">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f4f4f4;
}

.navbar{
background:#000;
}

.navbar-brand{
color:#ffc107!important;
font-weight:bold;
}

.card{
border:none;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.form-control,
.form-select{
border-radius:12px;
}

.btn-warning{
font-weight:bold;
border-radius:50px;
}

#map{
height:420px;
border-radius:15px;
margin-top:20px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a href="index.html"

class="navbar-brand">

<img src="images/logo.jpg"

width="45"

class="rounded-circle me-2">

Kalki Pradee Tours & Travels

</a>

</div>

</nav>

<div class="container py-5">

<div class="row">

<div class="col-lg-5">

<div class="card p-4">

<h2 class="mb-4">

Book Your Trip

</h2>

<form id="bookingForm">

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input

type="text"

id="name"

class="form-control"

required>

</div>

<div class="mb-3">

<label class="form-label">

Mobile Number

</label>

<input

type="tel"

id="mobile"

class="form-control"

placeholder="10-digit mobile number"

required>

</div>

<div class="mb-3">

<label class="form-label">

Journey Date

</label>

<input

type="date"

id="journeyDate"

class="form-control"

required>

</div>

<div class="mb-3">

<label class="form-label">

Passengers

</label>

<input

type="number"

id="passengers"

class="form-control"

min="1"

max="17"

required>

</div>

<div class="mb-3">

<label class="form-label">

Vehicle Type

</label>

<select

id="vehicle"

class="form-select"

required>

<option value="">

Select Vehicle

</option>

<option>

12+1 Tempo Traveller

</option>

<option>

17+1 Tempo Traveller

</option>

</select>

</div>
<div class="mb-3">

<label class="form-label">

Pickup Location

</label>

<div class="input-group">

<input
type="text"
id="pickup"
class="form-control"
placeholder="Search pickup location or use current location"
required>

<button
type="button"
id="currentLocation"
class="btn btn-warning">

<i class="bi bi-geo-alt-fill"></i>

</button>

</div>

</div>

<div class="mb-3">

<label class="form-label">

Destination (Karnataka Only)

</label>

<input
type="text"
id="destination"
class="form-control"
placeholder="Enter destination"
required>

</div>

<div class="mb-3">

<label class="form-label">

Estimated Distance (KM)

</label>

<input
type="number"
id="distance"
class="form-control"
placeholder="Example: 180"
min="1"
required>

<small class="text-muted">

Enter the approximate distance in kilometers.

</small>

</div>

<div class="mb-3">

<label class="form-label">

Special Requirements

</label>

<textarea
id="message"
class="form-control"
rows="4"
placeholder="Write any special requirements..."></textarea>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-warning btn-lg">

Book Now

</button>

</div>

</form>

</div>

</div>

<div class="col-lg-7">

<div class="card p-3">

<h4 class="mb-3">

Pickup Location Map

</h4>

<div id="map"></div>

<p class="mt-3 text-muted">

📍 You can search the pickup location or tap the location button to use your current location.

</p>

</div>

</div>

</div>

</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map("map").setView([12.9716,77.5946],7);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);

let marker;

document.getElementById("currentLocation").addEventListener("click",()=>{

if(!navigator.geolocation){

alert("Geolocation is not supported.");

return;

}

navigator.geolocation.getCurrentPosition(

async(position)=>{

const lat=position.coords.latitude;

const lng=position.coords.longitude;

map.setView([lat,lng],15);

if(marker){

map.removeLayer(marker);

}

marker=L.marker([lat,lng]).addTo(map);

try{

const response=await fetch(

`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`

);

const data=await response.json();

document.getElementById("pickup").value=data.display_name;

}catch{

document.getElementById("pickup").value=

lat+", "+lng;

}

},

()=>{

alert("Please allow location permission.");

}

);

});

document.getElementById("bookingForm").addEventListener("submit",(e)=>{

e.preventDefault();

alert("Booking form is ready. Next we'll connect EmailJS.");

});

</script>

<footer class="bg-dark text-white text-center py-4 mt-5">

<p class="mb-0">

© 2026 Kalki Pradee Tours & Travels

</p>

</footer>

</body>

</html>
