<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | Kalki Pradee Tours & Travels</title>

<link rel="icon" href="images/logo.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<section class="hero">

<div class="overlay">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-5">

<div class="card border-0 shadow-lg p-4">

<div class="text-center">

<img src="images/logo.png"
width="90">

<h2 class="mt-3">

Kalki Pradee

</h2>

<p>

Tours & Travels

</p>

</div>

<hr>

<h4 class="text-center">

Welcome Back

</h4>

<p class="text-center">

Login to continue your journey.

</p>

<form id="loginForm">

<div class="mb-3">

<label>

Email Address

</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="mb-3">

<label>

Password

</label>

<input
type="password"
id="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

<div class="d-flex justify-content-between">

<div>

<input
type="checkbox">

Remember Me

</div>

<a href="#">

Forgot Password?

</a>

</div>

<div class="d-grid mt-4">

<button
type="submit"
class="btn btn-warning">

Login

</button>

</div>

</form>

<hr>
<!-- Google Login -->

<div class="d-grid mb-3">

<button
type="button"
class="btn btn-light border">

<img
src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
width="20">

Continue with Google

</button>

</div>

<!-- Guest Login -->

<div class="d-grid mb-3">

<a
href="index.html"
class="btn btn-outline-dark">

Continue as Guest

</a>

</div>

<div class="text-center mt-4">

<p>

Don't have an account?

<a
href="signup.html"
class="text-warning
fw-bold
text-decoration-none">

Create Account

</a>

</p>

</div>

<hr>

<div class="text-center">

<h6>

Why Login?

</h6>

<div class="row mt-4">

<div class="col-4">

<i class="bi bi-calendar-check
display-6
text-warning"></i>

<p class="small mt-2">

Bookings

</p>

</div>

<div class="col-4">

<i class="bi bi-clock-history
display-6
text-warning"></i>

<p class="small mt-2">

History

</p>

</div>

<div class="col-4">

<i class="bi bi-person-circle
display-6
text-warning"></i>

<p class="small mt-2">

Profile

</p>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

</section>

<footer class="bg-black text-center text-white py-3">

<p class="mb-0">

© 2026 Kalki Pradee Tours & Travels

</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="js/login.js"></script>

</body>

</html>
