<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Bookings | Kalki Pradee Tours & Travels</title>

<link rel="icon" href="images/logo.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a href="index.html"
class="navbar-brand text-warning">

<i class="bi bi-arrow-left"></i>

Kalki Pradee Tours & Travels

</a>

</div>

</nav>

<section class="py-5">

<div class="container">

<div class="text-center">

<h2 class="fw-bold">

My Bookings

</h2>

<p>

View all your booked trips

</p>

</div>

<div class="row mt-4">

<div class="col-md-6 offset-md-3">

<input
type="text"
id="searchBooking"
class="form-control"
placeholder="Search destination...">

</div>

</div>

<div
class="row mt-5"
id="bookingList">

<!-- Firebase Bookings -->

</div>

</div>

</section>

<footer class="bg-dark text-white text-center py-3">

<p>

© 2026 Kalki Pradee Tours & Travels

</p>

</footer>
<script type="module">

import { app, auth } from "./js/firebase.js";

import {
getFirestore,
collection,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

const db=getFirestore(app);

const bookingList=document.getElementById("bookingList");

const search=document.getElementById("searchBooking");

let bookings=[];

onAuthStateChanged(auth,async(user)=>{

if(!user){

window.location.href="login.html";

return;

}

const q=query(

collection(db,"bookings"),

where("email","==",user.email)

);

const snapshot=await getDocs(q);

snapshot.forEach(doc=>{

bookings.push(doc.data());

});

displayBookings(bookings);

});

function displayBookings(data){

bookingList.innerHTML="";

if(data.length===0){

bookingList.innerHTML=`

<div class="col-12">

<div class="alert alert-warning text-center">

No Bookings Found

</div>

</div>

`;

return;

}

data.forEach(item=>{

bookingList.innerHTML+=`

<div class="col-lg-6 mb-4">

<div class="card shadow-lg border-0">

<div class="card-body">

<h4>${item.destination}</h4>

<p><b>Pickup:</b> ${item.pickup}</p>

<p><b>Date:</b> ${item.journeyDate}</p>

<p><b>Passengers:</b> ${item.passengers}</p>

<p><b>Fare:</b> ${item.fare}</p>

<p>

<b>Status:</b>

<span class="badge bg-warning">

Pending

</span>

</p>

</div>

</div>

</div>

`;

});

}

search.addEventListener("keyup",()=>{

const value=search.value.toLowerCase();

const filtered=bookings.filter(item=>

item.destination.toLowerCase().includes(value)

);

displayBookings(filtered);

});

</script>

</body>

</html>
