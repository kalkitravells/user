<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Kalki Pradee Tours & Travels</title>

<link rel="icon" href="images/logo.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<section class="hero">

<div class="overlay">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-6">

<div class="card border-0 shadow-lg p-4">

<div class="text-center">

<img src="images/logo.png"
width="90">

<h2 class="mt-3">

Create Your Account

</h2>

<p>

Join Kalki Pradee Tours & Travels

</p>

</div>

<hr>

<form id="signupForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>Full Name</label>

<input
type="text"
id="fullname"
class="form-control"
placeholder="Enter Full Name"
required>

</div>

<div class="col-md-6 mb-3">

<label>Phone Number</label>

<input
type="tel"
id="phone"
class="form-control"
placeholder="Enter Phone Number"
required>

</div>

</div>

<div class="mb-3">

<label>Email Address</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Password</label>

<input
type="password"
id="password"
class="form-control"
placeholder="Create Password"
required>

</div>

<div class="col-md-6 mb-3">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
class="form-control"
placeholder="Confirm Password"
required>

</div>

</div>
<div class="form-check mb-3">

<input
class="form-check-input"
type="checkbox"
id="terms"
required>

<label
class="form-check-label"
for="terms">

I agree to the Terms &
Privacy Policy

</label>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-warning">

Create Account

</button>

</div>

<hr>

<div class="text-center">

<p>

OR

</p>

<button
type="button"
class="btn btn-light border w-100"
id="googleSignup">

<img
src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
width="20">

Continue with Google

</button>

</div>

<div class="text-center mt-4">

<p>

Already have an account?

<a
href="login.html"
class="text-warning text-decoration-none fw-bold">

Login Here

</a>

</p>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</section>

<footer class="bg-black text-center text-white py-3">

<p class="mb-0">

© 2026 Kalki Pradee Tours & Travels

</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="js/signup.js"></script>

</body>

</html>
